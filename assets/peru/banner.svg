<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="AI Job Search, Edición Perú: la búsqueda de empleo que corre en tu máquina, adaptada al mercado laboral peruano.">
<style>
  .card { fill: #ffffff; stroke: #d0d7de; }
