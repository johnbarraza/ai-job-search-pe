<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-label="Programas de extensión: Becas de BCRP, reguladores y SMV que abren prácticas. Ordenadas por fecha de cierre, solo con fechas verificadas.">
<style>
  .card { fill: #ffffff; stroke: #d0d7de; }
  .title { fill: #1f2328; font: 700 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .eyebrow { fill: #D91023; font: 700 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 1.4px; }
  .text { fill: #59636e; font: 400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .chip-t { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .val { fill: #1f2328; font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .lbl { fill: #59636e; font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .track { fill: #eff2f5; }
  @media (prefers-color-scheme: dark) {
    .card { fill: #161b22; stroke: #30363d; }
    .title { fill: #e6edf3; }
    .eyebrow { fill: #ff6b7a; }
    .text, .lbl { fill: #9198a1; }
    .val { fill: #e6edf3; }
    .track { fill: #21262d; }
  }

  .c-amber { fill: #fff8c5; } .t-amber { fill: #7d4e00; } @media (prefers-color-scheme: dark) { .c-amber { fill: #3b2a06; } .t-amber { fill: #e3b341; } }
  .c-gray { fill: #eff2f5; } .t-gray { fill: #59636e; } @media (prefers-color-scheme: dark) { .c-gray { fill: #21262d; } .t-gray { fill: #9198a1; } }
  .c-red { fill: #fff0f1; } .t-red { fill: #a40e1c; } @media (prefers-color-scheme: dark) { .c-red { fill: #3d1418; } .t-red { fill: #ffb3bb; } }
