<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-label="Nivel del puesto: Clasificado desde el título: una práctica no se mezcla con un puesto senior.">
<style>
  .card { fill: #ffffff; stroke: #d0d7de; }
