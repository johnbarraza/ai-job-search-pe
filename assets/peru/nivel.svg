  .c-amber { fill: #fff8c5; } .t-amber { fill: #7d4e00; } @media (prefers-color-scheme: dark) { .c-amber { fill: #3b2a06; } .t-amber { fill: #e3b341; } }
  .c-blue { fill: #ddf4ff; } .t-blue { fill: #0550ae; } @media (prefers-color-scheme: dark) { .c-blue { fill: #0c2d4f; } .t-blue { fill: #79c0ff; } }
  .c-gray { fill: #eff2f5; } .t-gray { fill: #59636e; } @media (prefers-color-scheme: dark) { .c-gray { fill: #21262d; } .t-gray { fill: #9198a1; } }
  .c-red { fill: #fff0f1; } .t-red { fill: #a40e1c; } @media (prefers-color-scheme: dark) { .c-red { fill: #3d1418; } .t-red { fill: #ffb3bb; } }
